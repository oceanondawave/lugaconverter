[cerebrium.deployment]
name = "lugaconverter"
python_version = "3.11"
include = "[./*, main.py, cerebrium.toml]"

[cerebrium.hardware]
cpu = 2
memory = 8.0
gpu = "CPU"
gpu_count = 0

[cerebrium.scaling]
min_replicas = 0
max_replicas = 5

[cerebrium.dependencies.pip]
fastapi = ">=0.104.0"
uvicorn = ">=0.24.0"
pydantic = ">=2.0.0"
cryptography = ">=41.0.0"
requests = ">=2.31.0"

